<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIoT · Monitoring Anomali Energi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue-900:#0b2f6b; --blue-700:#1750b0; --blue-600:#1d63cc; --blue-100:#e6eefb; --blue-50:#f2f6fe;
  --bg:#f7f8fa; --surface:#fff; --surface-alt:#fbfbfd;
  --ink:#14202f; --ink-2:#3d4b60; --muted:#6b7a90; --line:#e3e7ee; --line-strong:#cfd6e2;
  --ok:#158a4f; --ok-bg:#e6f5ec; --warn:#b45309; --warn-bg:#fdf2e2; --bad:#c02b2b; --bad-bg:#fbeaea;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-lg:14px; --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(16,32,56,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--font);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;
      position:sticky;top:0;height:100vh;padding:var(--s5) 0 var(--s4)}
.brand{display:flex;gap:10px;align-items:center;padding:0 var(--s5);margin-bottom:var(--s6)}
.brand svg{width:30px;height:30px;flex:none}
.brand b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.brand small{display:block;font-size:11.5px;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px;padding:0 var(--s3)}
nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;color:var(--ink-2);
      text-decoration:none;font-weight:500;font-size:14px;border-left:2px solid transparent}
nav a svg{flex:none;opacity:.75}
nav a:hover{background:var(--surface-alt);color:var(--ink)}
nav a.on{background:var(--blue-50);color:var(--blue-700);border-left-color:var(--blue-600);font-weight:600}
.nav-foot{margin-top:auto;padding:0 var(--s5);font-size:11.5px;color:var(--muted);line-height:1.55}
main{padding:var(--s6) var(--s7) var(--s7);max-width:1400px;width:100%}
h1{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.25}
h2{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:0 0 var(--s6);font-size:13.5px;max-width:78ch}
.mono{font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
       box-shadow:var(--shadow);padding:var(--s5);margin-bottom:var(--s5)}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s4);margin-bottom:var(--s5)}
.panel-head p{margin:var(--s1) 0 0;color:var(--muted);font-size:12.5px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:var(--s5);align-items:start}
@media(max-width:1100px){.grid-2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s4);margin-bottom:var(--s5)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4) var(--s5);box-shadow:var(--shadow)}
.stat .l{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.2;margin-top:5px}
.stat .h{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)} .stat.ok .v{color:var(--ok)}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.btn{background:var(--blue-600);color:#fff;border:1px solid var(--blue-600);border-radius:8px;
     padding:9px 16px;font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;
     gap:7px;text-decoration:none;font-family:inherit;transition:.12s}
.btn:hover{background:var(--blue-700)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-alt);color:var(--ink)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--line)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:6px 13px;
      border-radius:99px;font:500 13px var(--font);cursor:pointer;transition:.12s}
.chip.on{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
input[type=text],input[type=url],input[type=password],input[type=number],input[type=file],select,textarea{border:1px solid var(--line);
      background:var(--surface);border-radius:8px;padding:8px 12px;font:inherit;font-size:13.5px;min-width:0;max-width:100%}
textarea{width:100%;min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;resize:vertical}
input[type=text]:focus,input[type=url]:focus,input[type=password]:focus,input[type=number]:focus,select:focus,textarea:focus{outline:2px solid var(--blue-100);border-color:var(--blue-600)}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:6px}
.field{margin-bottom:var(--s4)}
.hint{font-size:12px;color:var(--muted);margin:var(--s2) 0 0}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.b-anom{background:var(--bad-bg);color:var(--bad)} .b-out{background:var(--warn-bg);color:var(--warn)}
.b-norm{background:var(--ok-bg);color:var(--ok)} .b-info{background:var(--blue-100);color:var(--blue-700)}
.b-mute{background:#eef1f5;color:var(--muted)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--blue-900);color:#fff;padding:7px 11px;
     border-radius:8px;font-size:12px;line-height:1.5;display:none;white-space:nowrap;z-index:5}
.legend{display:flex;gap:var(--s4);font-size:12.5px;color:var(--muted);flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.legend i.dot{border-radius:50%}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
   font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-alt)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:520px}
.tw thead th{position:sticky;top:0;z-index:2}
.empty{text-align:center;color:var(--muted);padding:var(--s6) var(--s4);font-size:13.5px}
.empty b{display:block;color:var(--ink-2);font-size:14px;margin-bottom:var(--s1)}
.note{background:var(--blue-50);border:1px solid #dce7fa;color:#274a86;padding:11px 14px;border-radius:8px;font-size:12.5px;line-height:1.6}
.note.warn{background:var(--warn-bg);border-color:#f2dcbc;color:#8a4a08}
.note b{font-weight:600}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1px solid #f2dcbc;
        color:#8a4a08;padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:var(--s5)}
.notice svg{flex:none;margin-top:1px}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r-lg);padding:var(--s6) var(--s5);
     text-align:center;color:var(--muted);background:var(--surface-alt);cursor:pointer;transition:.14s}
.drop:hover,.drop.over{border-color:var(--blue-600);background:var(--blue-50);color:var(--blue-700)}
.drop b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:var(--s1)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s5) var(--s4)}
.kv small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px}
.kv b{font-size:15px;font-weight:600}
.tag{font-size:12px;color:var(--ink-2);font-family:ui-monospace,Menlo,monospace;background:#f4f6f9;padding:1px 6px;border-radius:5px}
.sheet{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:400px;background:var(--surface)}
.sheet table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.sheet th,.sheet td{padding:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sheet th{position:sticky;top:0;background:var(--surface-alt);z-index:2;padding:6px 8px;min-width:112px;
          text-transform:none;letter-spacing:0;color:var(--muted);font-weight:600;font-size:11.5px;text-align:center}
.sheet th.rn,.sheet td.rn{position:sticky;left:0;background:var(--surface-alt);color:var(--muted);
          text-align:center;min-width:44px;z-index:1;font-size:11.5px;padding:0}
.sheet th.rn{z-index:3}
.sheet td.c{height:30px;padding:0 9px;white-space:nowrap;cursor:cell;font-size:13px;font-variant-numeric:tabular-nums}
.sheet td.s{background:var(--blue-100)}
.sheet td.a{outline:2px solid var(--blue-600);outline-offset:-2px}
.sheet td input{width:100%;height:30px;border:0;outline:2px solid var(--blue-600);outline-offset:-2px;padding:0 9px;border-radius:0;background:var(--surface);font-size:13px}
.sheet tbody tr:hover{background:none}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:19px;border-radius:99px;background:var(--line-strong);position:relative;cursor:pointer;margin:0;flex:none}
.switch input:checked{background:var(--blue-600)}
.switch input::after{content:'';position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
.switch input:checked::after{left:17px}
.bar{height:6px;border-radius:99px;background:#eef1f5;overflow:hidden;min-width:64px}
.bar i{display:block;height:100%;background:var(--blue-600);border-radius:99px}
.kvrow{display:flex;justify-content:space-between;gap:var(--s4);padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kvrow:last-child{border-bottom:0}
.kvrow span:first-child{color:var(--muted)}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);
        overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{margin:0;flex:none} nav{flex-direction:row;padding:0;flex:none}
  nav a{border-left:0;border-bottom:2px solid transparent;white-space:nowrap}
  nav a.on{border-bottom-color:var(--blue-600)} .nav-foot{display:none}
  main{padding:var(--s5) var(--s4) var(--s6)} h1{font-size:21px}
}
@media print{aside,.noprint{display:none}.app{display:block}main{max-width:none;padding:0}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#1750b0"/>
        <path d="M8 21.5V15M13.3 21.5V10.5M18.7 21.5V17M24 21.5V12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <div><b>AIoT Monitor</b><small>Energi · Anomali</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="nav-foot" id="navfoot">memuat model…</div>
  </aside>
  <main id="main"></main>
</div>
<script>
"use strict";
/* ==============================================================================================
   AIoT dashboard.

   One UI, two data routes:
     LIVE   GET /live/{id}?since=…   polled ring buffer, incremental via `since`
     FILE   POST /datasets/{id}/score then GET /datasets/{id}/series  (scored once, cached)

   The browser never calls the model. Every score, label and alarm here comes from the same
   AnomalyScorer the REST API uses, so the dashboard shows what the service decides.
   ============================================================================================== */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf  = (v, d=0) => (v==null || Number.isNaN(v)) ? '–' : Number(v).toLocaleString('id-ID', {minimumFractionDigits:d, maximumFractionDigits:d});
const fx  = (v, d=3) => (v==null || Number.isNaN(v)) ? '–' : Number(v).toFixed(d);
/* Timestamps from the API are naive UTC ("2025-01-01T00:00"). `new Date` parses those as
   LOCAL time, which would shift every reading by the viewer's offset, so a missing zone designator
   gets an explicit 'Z' before parsing. */
const asUTC = t => {
  const s = String(t ?? '');
  return new Date(/[zZ]$|[+-]\d{2}:?\d{2}$/.test(s) ? s : s + 'Z');
};
const dts = t => asUTC(t).toLocaleString('id-ID', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', timeZone:'UTC'});
const dtsL = t => asUTC(t).toLocaleString('id-ID', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'UTC'});

async function api(path, opts={}) {
  const res = await fetch(path, {
    ...opts,
    headers: opts.body ? {'Content-Type':'application/json'} : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = {raw:text}; }
  if (!res.ok) {
    const detail = data && (data.detail || data.message);
    const err = new Error(typeof detail === 'string' ? detail : JSON.stringify(detail || data));
    err.status = res.status; err.payload = data;
    throw err;
  }
  return data;
}
function toast(msg, kind='info') {
  const el = document.createElement('div');
  el.className = 'note' + (kind === 'warn' ? ' warn' : '');
  el.style.cssText = 'position:fixed;right:24px;bottom:24px;z-index:60;max-width:400px;box-shadow:0 8px 24px rgba(16,32,56,.14)';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0';
                     setTimeout(() => el.remove(), 320); }, 5600);
}

const ALIASES = {
  building_id: 'building_id', building: 'building_id', asset_id: 'building_id', asset: 'building_id', meter_id: 'building_id',
  timestamp: 'timestamp', time: 'timestamp', datetime: 'timestamp', date: 'timestamp', ts: 'timestamp',
  meter_reading: 'meter_reading', reading: 'meter_reading', value: 'meter_reading', kwh: 'meter_reading',
  energy: 'meter_reading', consumption: 'meter_reading',
};

function normCol(h) { return String(h ?? "").trim().toLowerCase().replace(/ /g, "_").replace(/-/g, "_"); }

const I = {
  overview:'<path d="M3 13h5v8H3zM10 5h5v16h-5zM17 9h4v12h-4z"/>',
  monitor:'<path d="M3 17l5-6 4 3 5-8 4 5"/>',
  events:'<path d="M12 3l9 16H3zM12 9v5M12 17h.01"/>',
  datasets:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  live:'<circle cx="12" cy="12" r="3"/><path d="M6.5 6.5a7.8 7.8 0 000 11M17.5 6.5a7.8 7.8 0 010 11"/>',
  reports:'<path d="M7 3h7l5 5v13H7zM14 3v5h5"/><path d="M10 13h6M10 17h4"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
  up:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
  play:'<path d="M7 4l12 8-12 8z"/>',
  pause:'<path d="M8 5v14M16 5v14"/>',
  trash:'<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>',
  refresh:'<path d="M20 12a8 8 0 10-3 6.2M20 5v6h-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M4 20h4l10-10-4-4L4 16z"/>',
  csv:'<path d="M7 3h7l5 5v13H7zM14 3v5h5"/><path d="M9 13h6M9 16h6"/>',
};
const icon = (k, s=17) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]||''}</svg>`;

const PAGES = [
  ['overview',  'Overview',        'overview'],
  ['monitor',   'Monitoring',      'monitor'],
  ['live',      'Live Tail',       'live'],
  ['connection','Koneksi API',      'settings'],
  ['datasets',  'Datasets',        'datasets'],
  ['events',    'Anomaly Events',  'events'],
  ['settings',  'Settings',        'settings'],
];


function parseCSV(text) {
  const rows = [];
  let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else { q = false; }
      } else field += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c === '\r') { /* swallow */ }
    else field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function csvCell(v) {
  const s = v == null ? '' : String(v);
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function toCSV(headers, rows) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  return [headers.map(q).join(','), ...rows.map(r => r.map(q).join(','))].join('\n');
}


const S = {
  model: null, metrics: null, buildings: null, dsList: [],
  page: 'overview', threshold: null,
  refBuilding: null, refSeries: null,
  // live route
  liveId: null, livePts: [], liveSince: null, liveTimer: null, liveErr: '', liveStatus: null,
  liveInterval: 3000, livePolls: 0, liveLastAt: null,
  // file route
  datasetId: null, datasetMeta: null, datasetSummary: null, datasetPts: [],
  datasetBuilding: null, datasetErr: '',
  // sheet importer
  up: { headers: [], rows: [], name: '', fileName: '' },
  // events
  evLimit: 100, evFilter: 'all', evQuery: '',
  busy: new Set(),
};
function busy(k, on) { if (on === undefined) return S.busy.has(k); if (on) S.busy.add(k); else S.busy.delete(k); }


const head = (title, _sub, actions='') => `
  <div class="row sp" style="align-items:flex-start;margin-bottom:var(--s2);gap:var(--s4)">
    <h1>${title}</h1>
    ${actions ? `<div class="row noprint" style="gap:var(--s2)">${actions}</div>` : ''}
  </div>
  `;

const alarmBadge = a => {
  const m = {ANOMALY:['b-anom','Anomali'], OUTAGE:['b-out','Outage'], NORMAL:['b-norm','Normal']};
  const [cls, label] = m[a] || ['b-mute', a || '–'];
  return `<span class="badge ${cls}">${label}</span>`;
};
const scoreBar = (v, thr) => {
  const pct = v == null ? 0 : Math.max(2, Math.min(100, v * 100));
  const col = v == null ? 'var(--line-strong)' : v >= thr ? 'var(--bad)' : 'var(--blue-600)';
  return `<div class="bar"><i style="width:${pct.toFixed(1)}%;background:${col}"></i></div>`;
};
const errBox = e => `<div class="notice">${icon('events',16)}<div><b>Gagal memuat.</b> ${esc(e.message || e)}</div></div>`;

function drawLine(el, pts, opts = {}) {
  if (!el) return;
  const W = Math.max(el.clientWidth || 760, 300);
  const H = opts.h || 300;
  const pad = {l: 58, r: 14, t: 14, b: 26};
  const thr = opts.threshold;

  if (!pts.length) {
    el.innerHTML = `<div class="empty" style="padding:var(--s6)">Belum ada titik data untuk digambar.</div>`;
    return;
  }
  const valid = pts.filter(p => p.v != null);
  if (!valid.length) {
    el.innerHTML = `<div class="empty" style="padding:var(--s6)">Semua titik pada rentang ini berstatus outage (tanpa reading).</div>`;
    return;
  }
  let lo = Math.min(...valid.map(p => p.v)), hi = Math.max(...valid.map(p => p.v));
  const padY = (hi - lo) * 0.08 || Math.abs(hi) * 0.12 || 1;
  lo = Math.max(0, lo - padY); hi = hi + padY;

  const n = pts.length;
  const X = i => pad.l + (n <= 1 ? (W - pad.l - pad.r) / 2 : i / (n - 1) * (W - pad.l - pad.r));
  const Y = v => pad.t + (1 - (v - lo) / (hi - lo || 1)) * (H - pad.t - pad.b);

  let g = '';
  if (thr != null) {
    pts.forEach((p, i) => {
      if (p.flag) g += `<rect x="${(X(i) - 1.2).toFixed(1)}" y="${pad.t}" width="2.4" height="${H - pad.t - pad.b}" fill="#c02b2b" opacity=".15"/>`;
    });
  }
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4, y = Y(v);
    g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e9edf4"/>`;
    g += `<text x="${pad.l - 9}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#6b7a90">${fx(v, hi > 100 ? 0 : 1)}</text>`;
  }
  let d = '', pen = false;
  pts.forEach((p, i) => {
    if (p.v == null) { pen = false; return; }
    d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p.v).toFixed(1) + ' ';
    pen = true;
  });
  g += `<path d="${d}" fill="none" stroke="#1d63cc" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => {
    if (p.flag && p.v != null) g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="#c02b2b"/>`;
    else if (p.alarm === 'OUTAGE') g += `<circle cx="${X(i).toFixed(1)}" cy="${(H - pad.b).toFixed(1)}" r="2.2" fill="#b45309" opacity=".65"/>`;
  });
  const nt = Math.min(6, n);
  for (let k = 0; k < nt; k++) {
    const i = Math.round((n - 1) * k / Math.max(1, nt - 1));
    const lab = dts(pts[i].t).replace(/ \d{2}\.\d{2}$/, '');
    g += `<text x="${X(i).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="10.5" fill="#6b7a90">${esc(lab)}</text>`;
  }
  g += `<rect class="ov" x="${pad.l}" y="${pad.t}" width="${W - pad.l - pad.r}" height="${H - pad.t - pad.b}" fill="transparent"/>`;

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Grafik reading dan anomali">${g}</svg><div class="tip"></div>`;

  const svg = $('svg', el), tip = $('.tip', el), ov = $('.ov', el);
  ov.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round((x - pad.l) / (W - pad.l - pad.r) * (n - 1))));
    const p = pts[i];
    tip.style.display = 'block';
    tip.style.left = Math.max(4, Math.min(ev.clientX - r.left + 12, r.width - 210)) + 'px';
    tip.style.top  = Math.max(4, ev.clientY - r.top - 62) + 'px';
    tip.innerHTML = `<b>${esc(dtsL(p.t))}</b> UTC<br>reading ${p.v == null ? '–' : nf(p.v, 1) + ' kWh'}` +
      (p.score == null ? '<br>skor – (outage)' : `<br>skor ${fx(p.score, 3)}${p.flag ? ' · flag' : ''}`);
  });
  ov.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
}

/* ------------------------------------------------------------------ score strip */
function drawScores(el, pts, thr) {
  if (!el) return;
  const W = Math.max(el.clientWidth || 760, 300), H = 140;
  const pad = {l: 58, r: 14, t: 12, b: 24};
  if (!pts.length) { el.innerHTML = `<div class="empty" style="padding:var(--s4)">Belum ada skor.</div>`; return; }
  const maxV = thr != null ? Math.max(1.0, thr * 1.8) : 1.0;
  const n = pts.length;
  const X = i => pad.l + (n <= 1 ? (W - pad.l - pad.r) / 2 : i / (n - 1) * (W - pad.l - pad.r));
  const Y = v => pad.t + (1 - Math.min(1, v / maxV)) * (H - pad.t - pad.b);

  let g = '';
  for (let k = 0; k <= 2; k++) {
    const v = k / 2 * maxV, y = Y(v);
    g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e9edf4"/>`;
    g += `<text x="${pad.l - 9}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#6b7a90">${fx(v, 1)}</text>`;
  }
  if (thr != null) {
    g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(thr).toFixed(1)}" y2="${Y(thr).toFixed(1)}"
            stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4"/>`;
    g += `<text x="${W - pad.r}" y="${(Y(thr) - 5).toFixed(1)}" text-anchor="end" font-size="10.5"
            fill="#b45309">threshold ${fx(thr, 3)}</text>`;
  }
  let d = '', pen = false;
  pts.forEach((p, i) => {
    if (p.score == null) { pen = false; return; }
    d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p.score).toFixed(1) + ' ';
    pen = true;
  });
  g += `<path d="${d}" fill="none" stroke="#1750b0" stroke-width="1.5" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => {
    if (p.score == null) return;
    if (thr != null && p.score >= thr) g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.score).toFixed(1)}" r="2.6" fill="#c02b2b"/>`;
  });
  const nt = Math.min(6, n);
  for (let k = 0; k < nt; k++) {
    const i = Math.round((n - 1) * k / Math.max(1, nt - 1));
    const lab = dts(pts[i].t).replace(/ \d{2}\.\d{2}$/, '');
    g += `<text x="${X(i).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="10.5" fill="#6b7a90">${esc(lab)}</text>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Skor model per jam">${g}</svg>`;
}


var THEME_DIM = {};
function refPts() {
  const r = S.refSeries;
  const pts = Array.isArray(r) ? r : (r && r.points) || [];
  const thr = S.threshold;
  return pts.map(p => {
    const flag = p.flag || p.score >= thr;
    const alarm = p.alarm || (p.v == null ? 'OUTAGE' : flag ? 'ANOMALY' : 'NORMAL');
    return {t: p.t, v: p.v, score: p.score, flag, alarm};
  });
}

function src() {
  const thr = S.threshold;
  if (S.livePts.length) {
    return {kind: 'live', label: `Live tail · aset ${S.liveId}${S.connection?.config?.simulated ? ' · SIMULATED' : ''}`, short: 'Live',
            pts: S.livePts, threshold: thr};
  }
  if (S.datasetPts.length) {
    const b = S.datasetBuilding != null ? ` · aset ${S.datasetBuilding}` : '';
    return {kind: 'dataset', label: `${S.datasetMeta?.name || 'Dataset'}${b}`, short: 'Dataset',
            pts: S.datasetPts, threshold: thr};
  }
  const rp = refPts();
  if (rp.length) {
    return {kind: 'reference', label: `Building ${S.refBuilding} · held-out`, short: 'Referensi',
            pts: rp, threshold: thr};
  }
  return {kind: 'none', label: 'Belum ada sumber', short: '–', pts: [], threshold: thr};
}
function countAlarms(pts, thr) {
  let anomaly = 0, outage = 0, normal = 0;
  for (const p of pts) {
    if (p.alarm === 'OUTAGE') outage++;
    else if (p.score != null && p.score >= thr) anomaly++;
    else normal++;
  }
  return {anomaly, outage, normal, total: pts.length};
}

function topFlagRows(pts, thr, n) {
  const rows = pts.filter(p => (p.flag || p.alarm === 'ANOMALY') && p.score != null)
                   .sort((a, b) => b.score - a.score).slice(0, n);
  if (!rows.length) return `<tr><td colspan="4" class="empty">Tidak ada jam dengan skor di atas threshold.</td></tr>`;
  return rows.map(p => `<tr>
      <td>${esc(dtsL(p.t))} UTC</td>
      <td class="n mono">${p.v == null ? '–' : nf(p.v, 1)}</td>
      <td style="min-width:120px"><div class="mono">${fx(p.score,4)}</div>${scoreBar(p.score, thr)}</td>
      <td>${alarmBadge(p.alarm || (p.flag ? 'ANOMALY' : 'NORMAL'))}</td></tr>`).join('');
}

function afterRender() {
  const s = src();
  if (S.page === 'overview') {
    drawLine($('#c-ov'), s.pts, {h: 300, threshold: S.threshold});
  } else if (S.page === 'monitor') {
    drawLine($('#c-mon'), s.pts, {h: 320, threshold: S.threshold});
    drawScores($('#c-score'), s.pts, S.threshold);
  }
  /* Redraw on resize so the SVG viewBox matches the panel width. Debounced: a drag-resize
     fires dozens of events per second and each redraw rebuilds the whole SVG. */
  if (S._ro) S._ro.disconnect();
  let t = 0;
  const ro = new ResizeObserver(() => {
    clearTimeout(t);
    t = setTimeout(() => {
      if (S.page === 'overview') drawLine($('#c-ov'), src().pts, {h: 300, threshold: S.threshold});
      if (S.page === 'monitor') {
        drawLine($('#c-mon'), src().pts, {h: 320, threshold: S.threshold});
        drawScores($('#c-score'), src().pts, S.threshold);
      }
    }, 120);
  });
  const m = $('#main');
  if (m) { ro.observe(m); S._ro = ro; }
}

function stopLive() {
  if (S.liveTimer) { clearInterval(S.liveTimer); S.liveTimer = null; }
  const b = $('#btn-live-start'), s = $('#btn-live-stop');
  if (b) b.disabled = false;
  if (s) s.disabled = true;
}
function startLive() {
  const sel = $('#live-asset');
  const id = sel ? (sel.value === '' ? null : Number(sel.value)) : S.liveId;
  if (id == null || !Number.isInteger(id) || id < 0) { toast('Pilih aset yang sudah ada di buffer.', 'warn'); return; }
  S.liveId = id;
  S.liveSince = S.livePts.length ? S.livePts[S.livePts.length - 1].t : null;
  const iv = Number($('#live-interval')?.value || S.liveInterval);
  S.liveInterval = Math.min(30000, Math.max(1000, iv));

  const b = $('#btn-live-start'), s = $('#btn-live-stop');
  if (b) b.disabled = true;
  if (s) s.disabled = false;

  pollLive(true);
  if (S.liveTimer) clearInterval(S.liveTimer);
  S.liveTimer = setInterval(() => pollLive(false), S.liveInterval);
}

async function pollLive(first) {
  if (S.liveId == null) return;
  if (first) S.livePts = [];
  const url = `/live/${S.liveId}?limit=600` + (S.liveSince ? `&since=${encodeURIComponent(S.liveSince)}` : '');
  try {
    const snap = await api(url);
    S.liveErr = '';
    S.livePolls++;
    const pts = (snap.points || []).map(p => ({
      t: p.t, v: p.v, score: p.score, flag: p.flag, alarm: p.alarm,
      // The snapshot payload is for one building, so tag it here: the Events table and the CSV
      // export both key off `building_id` on the point itself.
      building_id: p.building_id != null ? p.building_id : S.liveId,
    }));
    if (!first && pts.length) {
      // `since` is inclusive on the server, so drop the duplicate boundary point.
      const dup = pts[0].t === S.liveSince ? 1 : 0;
      S.livePts = S.livePts.concat(pts.slice(dup));
    } else if (first) {
      S.livePts = pts;
    } else if (!pts.length) {
      // nothing new: keep the buffer as-is
    }
    if (snap.latest) S.liveSince = snap.latest;
    if (S.livePts.length > 2000) S.livePts = S.livePts.slice(-2000);
  } catch (e) {
    S.liveErr = e.message;
  }
  if (S.page !== 'live') return;
  $('#live-err').innerHTML = S.liveErr ? errBox({message: S.liveErr}) : '';
  const el = $('#live-polls');
  if (el) el.textContent = `${S.livePolls} poll`;
  const title = $('#live-title');
  if (title) title.textContent = S.liveId != null ? `aset ${S.liveId}` : 'belum ada aset dipilih';
  const sub = $('#live-sub');
  if (sub) {
    const last = S.livePts.length ? S.livePts[S.livePts.length - 1].t : null;
    sub.textContent = last ? `titik terakhir ${dtsL(last)} UTC · ${S.liveTimer ? 'polling aktif' : 'polling berhenti'}`
                           : (S.liveTimer ? 'polling aktif, menunggu titik baru' : 'Tekan Mulai untuk mulai polling.');
  }
  const cnt = $('#live-count');
  if (cnt) cnt.textContent = `${nf(S.livePts.length)} titik`;
  const al = $('#live-alarm');
  if (al) {
    const last = S.livePts.length ? S.livePts[S.livePts.length - 1] : null;
    if (last) {
      al.className = 'badge ' + (last.alarm === 'ANOMALY' ? 'b-anom' : last.alarm === 'OUTAGE' ? 'b-out' : 'b-norm');
      al.textContent = last.alarm || '–';
    } else { al.className = 'badge b-mute'; al.textContent = '–'; }
  }
  drawLine($('#c-live'), S.livePts, {h: 300, threshold: S.threshold});
  drawScores($('#c-live-score'), S.livePts, S.threshold);
  renderLiveRows();
  if ($('#live-autoscroll')?.checked) {
    const tw = $('#live-rows')?.closest('.tw');
    if (tw) tw.scrollTop = 0;
  }
}

async function seedLive() {
  const sel = $('#live-asset');
  const id = sel && sel.value ? Number(sel.value) : null;
  if (id == null || !Number.isInteger(id) || id < 0) { toast('Buffer kosong: tidak ada aset untuk di-seed. Kirim satu reading dulu, atau isi building_id manual.', 'warn'); return; }
  try {
    const r = await api(`/live/${id}/seed`, {method: 'POST'});
    toast(`Seed ${nf(r.seeded_points)} titik historis untuk aset ${id}.`);
    await refreshLiveStatus();
    go();
  } catch (e) { toast(e.message, 'warn'); }
}

async function pushReading() {
  const bidRaw = $('#ing-bid')?.value;
  const bid = bidRaw === '' || bidRaw == null ? NaN : Number(bidRaw);
  if (Number.isNaN(bid)) { toast('Isi building_id yang valid.', 'warn'); return; }
  const tsRaw = ($('#ing-ts')?.value || '').trim();
  const ts = tsRaw || new Date().toISOString().slice(0, 16);
  if (Number.isNaN(new Date(ts).getTime())) { toast('Timestamp tidak valid: gunakan format ISO, mis. 2026-11-17T09:00.', 'warn'); return; }
  const vRaw = ($('#ing-val')?.value || '').trim();
  const rec = {building_id: bid, timestamp: ts, meter_reading: vRaw === '' ? null : Number(vRaw)};

  const msg = $('#live-ingest-msg');
  if (msg) msg.innerHTML = `<span class="badge b-mute">mengirim…</span>`;
  try {
    const r = await api('/live/ingest', {method: 'POST', body: {records: [rec]}});
    S.liveStatus = r.buffer;
    if (msg) msg.innerHTML = `<span class="badge b-norm">diterima ${r.accepted}</span>
      ${r.rejected ? `<span class="badge b-out">ditolak ${r.rejected}</span>` : ''}
      <span class="hint">${nf(r.n_buildings_tracked)} aset di memori</span>`;
    // A brand-new asset appears in the buffer only after this ingest: refresh the select so it
    // becomes selectable without a manual page reload.
    if (!S.liveStatus.buildings.some(b => b.building_id === bid)) {
      await refreshLiveStatus();
      const sel = $('#live-asset');
      if (sel) {
        sel.insertAdjacentHTML('beforeend',
          `<option value="${bid}">aset ${bid} · baru</option>`);
        sel.value = String(bid);
      }
    }
    if (S.liveTimer) { S.liveSince = null; pollLive(true); }
  } catch (e) {
    if (msg) msg.innerHTML = `<span class="badge b-anom">gagal</span> <span class="hint">${esc(e.message)}</span>`;
  }
}

function clearLivePts() {

function topDatasetRows(pts, thr, n) {
  const rows = pts.filter(p => p.score != null).sort((a, b) => b.score - a.score).slice(0, n);
  if (!rows.length) return `<tr><td colspan="5" class="empty">Belum ada skor pada sumber ini.</td></tr>`;
  return rows.map(p => `<tr>
    <td>${esc(dtsL(p.t))} UTC</td>
    <td class="n mono">${p.building_id ?? '–'}</td>
    <td class="n mono">${p.v == null ? '–' : nf(p.v, 1)}</td>
    <td style="min-width:130px"><div class="mono">${fx(p.score,4)}</div>${scoreBar(p.score, thr)}</td>
    <td>${alarmBadge(p.alarm)}</td></tr>`).join('');
}

async function refreshDatasets() {
  try {
    const d = await api('/datasets');
    S.dsList = d.datasets || [];
  } catch (e) { S.datasetErr = e.message; }
  if (S.page === 'datasets') go();
}

async function useDataset(id) {
  busy('ds' + id, true);
  try {
    const meta = await api(`/datasets/${id}`);
    S.datasetId = id; S.datasetMeta = meta;
    try {
      const s = await api(`/datasets/${id}/series?limit=2000`);
      S.datasetPts = s.points.map(p => ({...p, building_id: p.building_id}));
      S.datasetSummary = {n_rows: s.n_rows, alert_rate: null, buildings: []};
      S.datasetBuilding = null;
      const summ = S.dsList.find(d => d.dataset_id === id);
      if (summ && summ.score) S.datasetSummary = summ.score;
    } catch (e) {
      // 409 = stored but never scored; keep the dataset selected and let the user press Skor.
      S.datasetPts = []; S.datasetBuilding = null;
      if (e.status === 409) toast('Dataset belum discor. Tekan Skor untuk menghitung anomali.');
      else throw e;
    }
    S.datasetErr = '';
  } catch (e) {
    S.datasetErr = e.message;
    S.datasetId = null; S.datasetPts = [];
  }
  go();
}

async function scoreDataset(id) {
  busy('ds' + id, true);
  go();
  try {
    const r = await api(`/datasets/${id}/score`, {method: 'POST', body: {}});
    toast(`Skor selesai: ${nf(r.scored_rows)} baris, ${nf(r.summary.n_anomaly)} anomali, ${nf(r.summary.n_outage)} outage.`);
    await refreshDatasets();
    await useDataset(id);
    toast(`Dataset ${r.name} siap dibuka.`);
  } catch (e) {
    S.datasetErr = e.message;
    toast(e.message, 'warn');
    go();
  } finally { busy('ds' + id, false); }
}

async function selectDsBuilding(bid) {
  const id = S.datasetId;
  if (!id) return;
  S.datasetBuilding = bid === '' ? null : Number(bid);
  try {
    const q = S.datasetBuilding == null ? '' : `&building_id=${S.datasetBuilding}`;
    const s = await api(`/datasets/${id}/series?limit=2000${q}`);
    S.datasetPts = s.points.map(p => ({...p, building_id: p.building_id}));
    const summ = S.dsList.find(d => d.dataset_id === id);
    S.datasetSummary = (summ && summ.score) ? summ.score : S.datasetSummary;
  } catch (e) {
    S.datasetErr = e.message;
    S.datasetPts = [];
  }
  go();
}

async function deleteDataset(id) {
  const d = (S.dsList || []).find(x => x.dataset_id === id);
  if (!confirm(`Hapus dataset "${d ? d.name : id}"? File CSV dan hasil scoringnya akan dihapus dari server.`)) return;
  try {
    await api(`/datasets/${id}`, {method: 'DELETE'});
    if (S.datasetId === id) { S.datasetId = null; S.datasetPts = []; S.datasetMeta = null; S.datasetSummary = null; }
    await refreshDatasets();
    toast('Dataset dihapus.');
    go();
  } catch (e) { toast(e.message, 'warn'); }
}

function bindDrop() {
  const d = $('#drop');
  if (!d) return;
  ['dragenter', 'dragover'].forEach(ev => d.addEventListener(ev, e => {
    e.preventDefault(); d.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach(ev => d.addEventListener(ev, e => {
    e.preventDefault(); d.classList.remove('over');
  }));
  d.addEventListener('drop', e => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
}

async function handleFile(file) {
  if (!file) return;
  const text = await file.text();
  $('#csv-text').value = text;
  const t = $('#drop-title');
  if (t) t.textContent = file.name;
  S.up.fileName = file.name;
  if (!S.up.name) {
    S.up.name = file.name.replace(/\.csv$/i, '');
    const n = $('#ds-name');
    if (n) n.value = S.up.name;
  }
  handleText(text);
}

function handleText(text) {
  const t = (text || '').trim();
  if (!t) {
    S.up = {headers: [], rows: [], name: S.up.name, fileName: S.up.fileName};
    renderSheet();
    return;
  }
  const parsed = parseCSV(t);
  if (!parsed.length) { renderSheet(); return; }
  const headers = parsed[0].map((h, i) => (h || '').trim() || `kolom${i + 1}`);
  const rows = parsed.slice(1).map(r => headers.map((_, i) => r[i] ?? ''));
  S.up.headers = headers;
  S.up.rows = rows.slice(0, 5000);   // cap preview rows: a big file is scored server-side, not here
  S.up.totalRows = rows.length;
  renderSheet();
}

function renderSheet() {
  const wrap = $('#sheet-wrap');
  if (!wrap) return;
  const {headers, rows} = S.up;
  if (!headers.length) {
    wrap.innerHTML = `<div class="empty">CSV akan muncul di sini sebagai spreadsheet yang bisa diedit.</div>`;
    const b = $('#btn-import'); if (b) b.disabled = true;
    const i = $('#sheet-info'); if (i) i.textContent = 'Belum ada data.';
    return;
  }
  const map = headers.map(h => ALIASES[normCol(h)] || null);
  const nBuild = new Set(rows.map(r => r[map.indexOf('building_id')])).size;
  const nTs = map.includes('timestamp') ? rows.filter(r => !Number.isNaN(new Date(r[map.indexOf('timestamp')]).getTime())).length : 0;
  const nVal = map.includes('meter_reading')
    ? rows.filter(r => r[map.indexOf('meter_reading')] !== '' && !Number.isNaN(Number(r[map.indexOf('meter_reading')]))).length : 0;

  const info = $('#sheet-info');
  if (info) {
    info.innerHTML = `${nf(S.up.totalRows ?? rows.length)} baris · ${headers.length} kolom ·
      target: <span class="tag">${map.filter(Boolean).join(', ') || 'belum ada kolom dikenali'}</span>` +
      (map.every(Boolean) ? ` <span class="badge b-norm">skema lengkap</span>`
                          : ` <span class="badge b-out">kolom belum lengkap</span>`);
  }
  const st = $('#import-state');
  if (st) {
    st.innerHTML = `${nf(nBuild)} aset · ${nf(nTs)} timestamp valid · ${nf(nVal)} reading numerik`;
  }
  const b = $('#btn-import');
  if (b) b.disabled = !(map.includes('building_id') && map.includes('timestamp') && map.includes('meter_reading'));

  const shown = rows.slice(0, 400);
  wrap.innerHTML = `<div class="sheet" id="sheet"><table>
    <thead><tr><th class="rn">#</th>
      ${headers.map((h, i) => `<th>${esc(h)}${map[i] ? `<div style="font-size:10.5px;color:var(--blue-700);font-weight:500">→ ${map[i]}</div>` : `<div style="font-size:10.5px;color:var(--warn);font-weight:500">abaikan</div>`}</th>`).join('')}
    </tr></thead>
    <tbody>${shown.map((r, ri) => `<tr>
      <td class="rn" onclick="toggleSheetRow(${ri})" title="Klik untuk hapus baris ini">${ri + 1}</td>
      ${r.map((c, ci) => `<td class="c" data-r="${ri}" data-c="${ci}" onclick="editCell(this, ${ri}, ${ci})">${esc(c)}</td>`).join('')}
    </tr>`).join('')}</tbody>
  </table></div>
  ${rows.length > shown.length ? `<p class="hint">Menampilkan ${shown.length} dari ${nf(rows.length)} baris pertama. Baris lainnya tetap dikirim ke server.</p>` : ''}`;
  bindSheetKeys();
}

function bindSheetKeys() {
  $$('#sheet td.c').forEach(td => {
    td.addEventListener('keydown', e => {
      const r = Number(td.dataset.r), c = Number(td.dataset.c);
      const move = {ArrowRight:[r, c + 1], ArrowLeft:[r, c - 1], ArrowDown:[r + 1, c], ArrowUp:[r - 1, c]}[e.key];
      if (!move) return;
      e.preventDefault();
      const nx = $(`#sheet td.c[data-r="${move[0]}"][data-c="${move[1]}"]`);
      if (nx) nx.focus();
    });
  });
}

function editCell(td, r, c) {
  const cur = td.textContent;
  td.innerHTML = `<input value="${esc(cur)}" onkeydown="cellKey(event,this,${r},${c})" onblur="cellDone(this,${r},${c})">`;
  const inp = $('input', td);
  inp.focus(); inp.select();
}
function cellDone(inp, r, c) {
  const td = inp.parentElement;
  S.up.rows[r][c] = inp.value;
  td.textContent = inp.value;
  const map = S.up.headers.map(h => ALIASES[normCol(h)] || null);
  const st = $('#import-state');
  if (st) {
    const nTs = map.includes('timestamp')
      ? S.up.rows.filter(x => !Number.isNaN(new Date(x[map.indexOf('timestamp')]).getTime())).length : 0;
    const nVal = map.includes('meter_reading')
      ? S.up.rows.filter(x => x[map.indexOf('meter_reading')] !== '' && !Number.isNaN(Number(x[map.indexOf('meter_reading')]))).length : 0;
    st.innerHTML = `${nf(S.up.rows.length)} baris · ${nf(nTs)} timestamp valid · ${nf(nVal)} reading numerik`;
  }
}
function cellKey(e, inp, r, c) {
  if (e.key === 'Enter') { e.preventDefault(); cellDone(inp, r, c); }
  if (e.key === 'Escape') { const td = inp.parentElement; td.textContent = S.up.rows[r][c]; }
  if (e.key === 'Tab') { e.preventDefault(); cellDone(inp, r, c); const nx = $(`#sheet td.c[data-r="${r}"][data-c="${c + 1}"]`) || $(`#sheet td.c[data-r="${r + 1}"][data-c="0"]`); if (nx) editCell(nx, Number(nx.dataset.r), Number(nx.dataset.c)); }
}
function toggleSheetRow(ri) {
  if (ri >= 400) { toast('Baris di luar pratinjau tidak bisa dihapus dari sini.', 'warn'); return; }
  if (!confirm(`Hapus baris ${ri + 1} dari pratinjau?`)) return;
  S.up.rows.splice(ri, 1);
  renderSheet();
}
function addSheetRow() {
  S.up.rows.push(S.up.headers.map(() => ''));
  S.up.totalRows = S.up.rows.length;
  renderSheet();
  const w = $('#sheet'); if (w) w.scrollTop = w.scrollHeight;
}
function addSheetCol() {
  const name = prompt('Nama kolom baru:', 'kolom_baru');
  if (!name) return;
  S.up.headers.push(name);
  S.up.rows.forEach(r => r.push(''));
  renderSheet();
}

async function importSheet() {
  const {headers, rows, name} = S.up;
  if (!headers.length) { toast('Belum ada CSV untuk diimpor.', 'warn'); return; }
  const map = headers.map(h => ALIASES[normCol(h)] || null);
  const missing = ['building_id', 'timestamp', 'meter_reading'].filter(c => !map.includes(c));
  if (missing.length) { toast(`Kolom wajib belum terpetakan: ${missing.join(', ')}`, 'warn'); return; }

  const csv = toCSV(headers, rows);
  const btn = $('#btn-import'), st = $('#import-state');
  if (btn) { btn.disabled = true; btn.textContent = 'Mengirim…'; }
  if (st) st.textContent = 'mengunggah ke server…';
  try {
    const r = await api('/datasets', {method: 'POST', body: {name: name || 'dataset-bernomor', csv}});
    const rep = r.import || {};
    toast(`Impor ok: ${nf(rep.n_rows)} baris, ${nf(rep.n_buildings)} aset.`);
    await refreshDatasets();
    await useDataset(r.dataset.dataset_id);
    go();
    if (r.dataset.dataset_id && !(r.dataset.score || {}).n_rows) {
      toast('Dataset tersimpan tapi belum discor. Tekan Skor untuk menghitung anomali.');
    }
  } catch (e) {
    if (st) st.innerHTML = `<span class="badge b-anom">gagal</span> ${esc(e.message)}`;
    toast(e.message, 'warn');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = `${icon('up',15)} Impor ke server`; }
  }
}

function exportDatasetCSV() {
  if (!S.datasetPts.length) { toast('Belum ada data untuk diunduh.', 'warn'); return; }
  const csv = toCSV(
    ['building_id', 'timestamp', 'meter_reading', 'score', 'flag', 'alarm'],
    S.datasetPts.map(p => [p.building_id ?? '', p.t, p.v == null ? '' : p.v,
                           p.score == null ? '' : p.score, p.flag ? 1 : 0, p.alarm || ''])
  );

function eventsRows() {
  const ev = S.evFilter || 'all';
  const defs = {
    all: {t: () => true},
    anomaly: {t: p => p.alarm === 'ANOMALY'},

/* `go` is callable both as a hashchange listener and directly from inline handlers
   (`go('#datasets')`, `go('datasets')`, `go()`); the event object a listener receives is
   detected and ignored rather than stringified into a page name. */
async function go(hash) {
  const raw = (hash && typeof hash === 'object') ? null : hash;
  const want = raw == null || raw === ''
    ? currentPage()
    : String(raw).replace(/^#/, '').split('?')[0];
  if (want !== currentPage()) {
    const target = '#' + want;
    if (location.hash !== target) { location.hash = target; return; }   // hashchange re-enters here
  }
  S.page = VIEWS[want] ? want : 'overview';
  stopLive();
  if (S.connectionTimer) { clearInterval(S.connectionTimer); S.connectionTimer = null; }
  if (S.page === 'connection' || S.page === 'live' || S.page === 'overview') {
    try { S.connection = await api('/connection'); }
    catch (e) { S.connection = {error:e.message}; }
  }
  /* The live buffer is process-local and changes while the user reads the page, so the Live Tail
     view re-reads it before rendering: otherwise the asset <select> would show the buffer as it
     was when the page last loaded, not as it is now. */
  if (S.page === 'live' || S.page === 'overview') {
    try { const st = await api('/live/status'); S.liveStatus = st; } catch { /* leave as-is */ }
  }
  renderNav();
  const v = VIEWS[S.page] || vOverview;
  $('#main').innerHTML = v();
  const fn = AFTER[S.page];
  if (fn) { try { fn(); } catch (e) { console.error(e); } }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', go);

/* The model/threshold chips live in the sidebar footer (#navfoot), not a #topbar element:
   keeping the lookup here means the function is a no-op if the markup ever changes instead of
   silently rendering nothing. */
async function refreshTopbar() {
  const tb = $('#topbar');
  if (!tb) return;
  const bits = [`<span class="tag">${esc(S.health?.model || 'model')}</span>`, `<span class="tag">${nf(S.health?.n_features)} fitur</span>`];
  if (S.threshold != null) bits.push(`<span class="tag">threshold ${fx(S.threshold, 3)}</span>`);
  if (S.page === 'live' && S.liveStatus) bits.push(liveStatusHTML());
  tb.innerHTML = bits.join(' ');
}

/* The page never starts on a fabricated chart: it waits for /health + /metrics, then
   loads the real series for the page the user is on. */
async function reloadAll() {
  await refreshTopbar();
  if (S.page === 'monitor') await loadRefSeries(S.refBuilding ?? S.monitorId);
  if (S.page === 'live') await refreshLiveStatus();
  if (S.page === 'datasets') await refreshDatasets();
  go();
}

async function boot() {
  $('#main').innerHTML = '<div class="notice" role="status">Memuat data dashboard…</div>';
  renderNav();
  try {
    const [h, m, mo, b] = await Promise.all([
      api('/health'), api('/metrics'), api('/model'), api('/buildings'),
    ]);
    S.health = h; S.metrics = m; S.model = mo; S.buildings = b.buildings || [];
    S.threshold = h.threshold;
    if (S.buildings.length) {
      // GET /buildings returns `building_id` (see backend/app/main.py), not `id`.
      S.monitorId = S.buildings[0].building_id;
      if (S.buildings.length > 1) S.monitorId2 = S.buildings[1].building_id;
      // Baseline series for the reference view. Not a live feed: it is the frozen held-out
      // split, so the page has a real chart before any import or ingest happens.
      S.refBuilding = S.refBuilding ?? S.monitorId;
    }
    // Optional endpoints: their absence is shown as an empty state, never as fake data.
    try { const st = await api('/live/status'); S.liveStatus = st; if (st.buildings?.length) S.liveId = st.buildings[0].building_id; } catch { S.liveStatus = null; }
    try { const d = await api('/datasets'); S.dsList = d.datasets || []; } catch { S.dsList = []; }
    try { await loadRefSeries(S.refBuilding); } catch { S.refSeries = null; }
  } catch (e) {
    S.error = e.message;
    $('#main').innerHTML = `<div class="notice">${icon('alert',18)}<div>
      <b>Gagal memuat data backend</b><br>${esc(e.message)}<br><span class="hint">
      Jalankan <code>uvicorn backend.app.main:app --port 8000</code> lalu muat ulang halaman.</span></div></div>
      ${errBox({message: e.message})}`;
    return;
  }
  await refreshTopbar();
  go();
}

/* Start once the whole script has been evaluated: boot() is called from here rather than at
   the point of definition, because VIEWS/AFTER are const bindings declared further down and
   would still be in their temporal dead zone at that point. */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot, {once: true});
} else {
  boot();
}
</script>
</body>
</html>
